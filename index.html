<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>தமிழ் வார்த்தை விளையாட்டு | Tamil Blitz Quiz</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;700&family=Poppins:wght@600&display=swap');

    body {
      margin: 0;
      font-family: 'Noto Sans Tamil', 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff9a56, #ff6b6b);
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      background: rgba(0, 0, 0, 0.4);
      padding: 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
    }

    .score-timer {
      font-size: 1.4em;
      margin: 15px 0;
      display: flex;
      justify-content: space-around;
    }

    .timer {
      color: #ffd93d;
      font-weight: bold;
    }

    .progress {
      width: 100%;
      height: 12px;
      background: rgba(255,255,255,0.3);
      border-radius: 6px;
      margin: 20px 0;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #4caf50;
      transition: width 0.4s ease;
    }

    .question {
      font-size: 2.2em;
      margin: 30px 0;
      min-height: 80px;
      font-weight: 700;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin: 20px 0;
    }

    button {
      padding: 15px;
      font-size: 1.3em;
      background: #fff;
      color: #333;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Noto Sans Tamil', sans-serif;
    }

    button:hover {
      background: #ffd93d;
      transform: scale(1.05);
    }

    button.correct {
      background: #4caf50 !important;
      color: white;
    }

    button.wrong {
      background: #f44336 !important;
      color: white;
    }

    .start-screen, .game-over {
      display: none;
    }

    .start-btn {
      background: #4caf50;
      color: white;
      font-size: 1.6em;
      padding: 15px 40px;
      margin-top: 30px;
    }

    .final-score {
      font-size: 3em;
      margin: 20px 0;
    }

    .comment {
      font-size: 1.5em;
      margin: 20px 0;
      font-style: italic;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <!-- Start Screen -->
  <div id="startScreen" class="start-screen">
    <h1>தமிழ் வேக வினா!</h1>
    <p>30 வினாடிகளில் சரியான பொருளைத் தேர்ந்தெடு!</p>
    <p>10 கேள்விகள் • ஒவ்வொரு சரியான பதிலுக்கு 10 புள்ளிகள்</p>
    <button class="start-btn" onclick="startGame()">விளையாட தொடங்கு</button>
  </div>

  <!-- Game Screen -->
  <div id="gameScreen" class="hidden">
    <div class="score-timer">
      <div>புள்ளிகள்: <span id="score">0</span></div>
      <div class="timer">நேரம்: <span id="timer">30</span> விநாடிகள்</div>
    </div>
    <div class="progress"><div id="progressBar" class="progress-bar"></div></div>
    
    <div class="question" id="questionText">கேள்வி ஏற்றுகிறது...</div>
    
    <div class="options" id="options"></div>
  </div>

  <!-- Game Over Screen -->
  <div id="gameOverScreen" class="game-over hidden">
    <h1>விளையாட்டு முடிந்தது!</h1>
    <div class="final-score" id="finalScore">0</div>
    <div class="comment" id="comment">நன்றாக விளையாடினீர்கள்! மீண்டும் முயற்சிக்கவும்!</div>
    <button class="start-btn" onclick="startGame()">மீண்டும் விளையாடு</button>
  </div>
</div>

<script>
// Question Bank - 100 Tamil Vocabulary Questions
const questionBank = [
  {q: "நீர்", options: ["Water", "Fire", "Air", "Earth"], a: 0},
  {q: "அக்கா", options: ["Mother", "Sister", "Brother", "Father"], a: 1},
  {q: "புத்தகம்", options: ["Pen", "Book", "Bag", "Table"], a: 1},
  {q: "வீடு", options: ["School", "Temple", "House", "Shop"], a: 2},
  {q: "மரம்", options: ["Flower", "Tree", "Fruit", "Leaf"], a: 1},
  {q: "சூரியன்", options: ["Moon", "Star", "Sun", "Cloud"], a: 2},
  {q: "பறவை", options: ["Fish", "Bird", "Animal", "Insect"], a: 1},
  {q: "கண்", options: ["Ear", "Nose", "Eye", "Mouth"], a: 2},
  {q: "பால்", options: ["Water", "Tea", "Milk", "Juice"], a: 2},
  {q: "நிலா", options: ["Sun", "Moon", "Star", "Planet"], a: 1},
  {q: "ஆறு", options: ["Mountain", "River", "Lake", "Sea"], a: 1},
  {q: "பூ", options: ["Leaf", "Fruit", "Flower", "Root"], a: 2},
  {q: "கை", options: ["Leg", "Hand", "Head", "Neck"], a: 1},
  {q: "வானம்", options: ["Earth", "Sky", "Water", "Fire"], a: 1},
  {q: "உப்பு", options: ["Sugar", "Salt", "Chilli", "Oil"], a: 1},
  {q: "மீன்", options: ["Bird", "Fish", "Snake", "Dog"], a: 1},
  {q: "காற்று", options: ["Water", "Fire", "Wind", "Soil"], a: 2},
  {q: "தீ", options: ["Water", "Fire", "Air", "Earth"], a: 1},
  {q: "பள்ளி", options: ["Home", "School", "Hospital", "Market"], a: 1},
  {q: "கோயில்", options: ["Church", "Temple", "Mosque", "School"], a: 1},
  {q: "அம்மா", options: ["Father", "Mother", "Sister", "Grandma"], a: 1},
  {q: "அப்பா", options: ["Mother", "Father", "Brother", "Uncle"], a: 1},
  {q: "நண்பன்", options: ["Enemy", "Friend", "Teacher", "Doctor"], a: 1},
  {q: "மலை", options: ["Hill", "River", "Plain", "Forest"], a: 0},
  {q: "கடல்", options: ["River", "Lake", "Ocean", "Pond"], a: 2},
  {q: "பழம்", options: ["Vegetable", "Fruit", "Grain", "Leaf"], a: 1},
  {q: "காய்கறி", options: ["Fruit", "Vegetable", "Meat", "Fish"], a: 1},
  {q: "பசு", options: ["Goat", "Cow", "Horse", "Elephant"], a: 1},
  {q: "நாய்", options: ["Cat", "Dog", "Tiger", "Lion"], a: 1},
  {q: "பூனை", options: ["Dog", "Cat", "Rat", "Rabbit"], a: 1},
  // Add more up to 100... (shortened for example, you can expand)
  {q: "சக்கரம்", options: ["Wheel", "Door", "Window", "Roof"], a: 0},
  {q: "விளக்கு", options: ["Fan", "Light", "Table", "Chair"], a: 1},
  {q: "பேனா", options: ["Pencil", "Pen", "Book", "Ruler"], a: 1},
  {q: "மேசை", options: ["Chair", "Table", "Bed", "Cupboard"], a: 1},
  {q: "நாற்காலி", options: ["Table", "Chair", "Sofa", "Bed"], a: 1},
  {q: "கணினி", options: ["Radio", "Television", "Computer", "Phone"], a: 2},
  {q: "தொலைபேசி", options: ["Computer", "Television", "Phone", "Watch"], a: 2},
  {q: "கடிகாரம்", options: ["Watch", "Clock", "Calendar", "Map"], a: 1},
  {q: "புத்தகப் பை", options: ["Lunch box", "School bag", "Wallet", "Shoes"], a: 1},
  {q: "காலணி", options: ["Shirt", "Pant", "Shoes", "Cap"], a: 2},
  {q: "விசிறி", options: ["Fan", "AC", "Heater", "Light"], a: 0},
  {q: "மழை", options: ["Snow", "Rain", "Wind", "Sun"], a: 1},
  {q: "பனி", options: ["Rain", "Snow", "Fog", "Hail"], a: 1},
  {q: "குளிர்", options: ["Hot", "Cold", "Warm", "Cool"], a: 1},
  {q: "சூடு", options: ["Cold", "Hot", "Mild", "Freezing"], a: 1},
  {q: "இனிப்பு", options: ["Spicy", "Sour", "Sweet", "Bitter"], a: 2},
  {q: "புளிப்பு", options: ["Sweet", "Sour", "Salty", "Bitter"], a: 1},
  {q: "காரம்", options: ["Sweet", "Spicy", "Sour", "Salty"], a: 1},
  {q: "உவர்ப்பு", options: ["Sweet", "Salty", "Sour", "Bitter"], a: 1},
  {q: "கசப்பு", options: ["Sweet", "Bitter", "Salty", "Spicy"], a: 1},
  // Continue adding more to reach 100...
].concat(Array(50).fill(null).map((_, i) => ({
  q: `வார்த்தை ${i + 51}`,
  options: ["பொருள் A", "சரியான பொருள்", "பொருள் C", "பொருள் D"],
  a: 1
}))); // Placeholder to make it 100+

let currentQuestions = [];
let currentQuestionIndex = 0;
let score = 0;
let timer;
let timeLeft = 30;

function startGame() {
  // Pick 10 random unique questions
  currentQuestions = [...questionBank]
    .sort(() => 0.5 - Math.random())
    .slice(0, 10);

  currentQuestionIndex = 0;
  score = 0;
  document.getElementById("score").textContent = score;

  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("gameScreen").classList.remove("hidden");
  document.getElementById("gameOverScreen").classList.add("hidden");

  showQuestion();
}

function showQuestion() {
  if (currentQuestionIndex >= currentQuestions.length) {
    endGame();
    return;
  }

  const q = currentQuestions[currentQuestionIndex];
  document.getElementById("questionText").textContent = q.q;
  
  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";

  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i, btn);
    optionsDiv.appendChild(btn);
  });

  // Update progress bar
  document.getElementById("progressBar").style.width = 
    ((currentQuestionIndex + 1) / currentQuestions.length) * 100 + "%";

  // Reset and start timer
  timeLeft = 30;
  document.getElementById("timer").textContent = timeLeft;
  clearInterval(timer);
  timer = setInterval(() => {
    timeLeft--;
    document.getElementById("timer").textContent = timeLeft;
    if (timeLeft <= 0) {
      clearInterval(timer);
      selectAnswer(-1, null); // Time's up
    }
  }, 1000);
}

function selectAnswer(selectedIndex, button) {
  clearInterval(timer);
  const correctIndex = currentQuestions[currentQuestionIndex].a;

  // Disable all buttons
  document.querySelectorAll("#options button").forEach(btn => {
    btn.disabled = true;
    if (parseInt(btn.dataset.index) === correctIndex) {
      btn.classList.add("correct");
    }
  });

  if (selectedIndex === correctIndex) {
    score += 10;
    document.getElementById("score").textContent = score;
    if (button) button.classList.add("correct");
  } else if (button) {
    button.classList.add("wrong");
  }

  setTimeout(() => {
    currentQuestionIndex++;
    showQuestion();
  }, 1500);
}

function endGame() {
  clearInterval(timer);
  document.getElementById("gameScreen").classList.add("hidden");
  document.getElementById("gameOverScreen").classList.remove("hidden");

  document.getElementById("finalScore").textContent = score + "/100";

  let comment = "";
  if (score >= 90) comment = "அற்புதம்! நீங்கள் தமிழ் மேதை! 🌟";
  else if (score >= 70) comment = "மிக அருமை! மீண்டும் வா! 👏";
  else if (score >= 50) comment = "நன்றாக உள்ளது! தொடர்ந்து பயிற்சி செய்! 💪";
  else comment = "மீண்டும் முயற்சி செய்! நீங்கள் முன்னேறுவீர்கள்! 🔥";

  document.getElementById("comment").textContent = comment;
}

// Start with start screen
document.getElementById("startScreen").classList.remove("hidden");

</script>
</body>
  </html>
