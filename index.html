<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>தமிழ் வேக வினா | Tamil Blitz Quiz</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;700&family=Poppins:wght@600&display=swap');

    body {
      margin: 0;
      font-family: 'Noto Sans Tamil', 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff9a56, #ff6b6b);
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      background: rgba(0, 0, 0, 0.4);
      padding: 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 { font-size: 2.5em; margin-bottom: 10px; text-shadow: 2px 2px 8px rgba(0,0,0,0.6); }
    .score-timer { font-size: 1.4em; margin: 15px 0; display: flex; justify-content: space-around; }
    .timer { color: #ffd93d; font-weight: bold; }

    .progress { width: 100%; height: 12px; background: rgba(255,255,255,0.3); border-radius: 6px; margin: 20px 0; overflow: hidden; }
    .progress-bar { width: 0%; height: 100%; background: #4caf50; transition: width 0.4s ease; }

    .question { font-size: 2.4em; margin: 30px 0; min-height: 80px; font-weight: 700; }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin: 20px 0;
    }

    button {
      padding: 18px;
      font-size: 1.3em;
      background: #fff;
      color: #333;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
    }

    button:hover { background: #ffd93d; transform: scale(1.05); }
    button.correct { background: #4caf50 !important; color: white; }
    button.wrong { background: #f44336 !important; color: white; }

    .start-btn {
      background: #4caf50;
      color: white;
      font-size: 1.6em;
      padding: 15px 50px;
      margin-top: 30px;
    }

    .final-score { font-size: 3.5em; margin: 20px 0; }
    .comment { font-size: 1.6em; margin: 20px 0; font-style: italic; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <!-- Start Screen -->
  <div id="startScreen">
    <h1>தமிழ் வேக வினா!</h1>
    <p>30 வினாடிகளில் சரியான பொருளைத் தேர்ந்தெடு!</p>
    <p>10 கேள்விகள் • சரியான பதிலுக்கு 10 புள்ளிகள்</p>
    <button class="start-btn" onclick="startGame()">விளையாட தொடங்கு</button>
  </div>

  <!-- Game Screen -->
  <div id="gameScreen" class="hidden">
    <div class="score-timer">
      <div>புள்ளிகள்: <span id="score">0</span></div>
      <div>நேரம்: <span id="timer">30</span> விநா</div>
    </div>
    <div class="progress"><div id="progressBar" class="progress-bar"></div></div>
    <div class="question" id="questionText"></div>
    <div class="options" id="options"></div>
  </div>

  <!-- Game Over Screen -->
  <div id="gameOverScreen" class="hidden">
    <h1>விளையாட்டு முடிந்தது!</h1>
    <div class="final-score" id="finalScore">0</div>
    <div class="comment" id="comment"></div>
    <button class="start-btn" onclick="startGame()">மீண்டும் விளையாடு</button>
  </div>
</div>

<script>

  {q:"போகிறேன்",options:["Coming","Going","Eating","Sleeping"],a:1},
  {q:"சாப்பிடு",options:["Drink","Eat","Sleep","Play"],a:1},

  {q:"விளையாடு",options:["Study","Play","Work","Sleep"],a:1},

  {q:"போ",options:["Come","Go","Sit","Stand"],a:1},
  {q:"உட்கார்",options:["Stand","Sit","Run","Jump"],a:1},
  {q:"நில்",options:["Sit","Stand","Lie down","Jump"],a:1},
  {q:"எழுந்திரு",options:["Sleep","Wake up","Sit","Stand"],a:1},
  {q:"புன்னகை",options:["Cry","Smile","Shout","Sleep"],a:1},
  {q:"அழு",options:["Laugh","Cry","Smile","Shout"],a:1},
  {q:"சிரி",options:["Cry","Laugh","Shout","Sleep"],a:1},
  {q:"கோபம்",options:["Happy","Angry","Sad","Sleep"],a:1},
  {q:"மகிழ்ச்சி",options:["Sad","Happy","Angry","Tired"],a:1},
  {q:"பயம்",options:["Brave","Fear","Happy","Angry"],a:1},
  {q:"பசி",options:["Thirst","Hunger","Sleep","Play"],a:1},
  {q:"தாகம்",options:["Hunger","Thirst","Tired","Cold"],a:1},
  {q:"களைப்பு",options:["Energy","Tired","Happy","Sad"],a:1},
  {q:"இசை",options:["Noise","Music","Dance","Picture"],a:1},
  {q:"ஓவியம்",options:["Music","Painting","Dance","Story"],a:1},
  {q:"கதை",options:["Song","Story","Game","Picture"],a:1},
  {q:"கணிதம்",options:["Tamil","Maths","Science","English"],a:1},
  {q:"அறிவியல்",options:["Maths","Science","History","Art"],a:1},
  {q:"வரலாறு",options:["Future","History","Geography","Biology"],a:1},
  {q:"புவியியல்",options:["History","Geography","Physics","Chemistry"],a:1}
];

let currentQuestions = [];
let currentQuestionIndex = 0;
let score = 0;
let timer;
let timeLeft = 30;

function startGame() {
  currentQuestions = [...questionBank].sort(() => 0.5 - Math.random()).slice(0, 10);
  currentQuestionIndex = 0;
  score = 0;
  document.getElementById("score").textContent = score;

  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("gameScreen").classList.remove("hidden");
  document.getElementById("gameOverScreen").classList.add("hidden");

  showQuestion();
}

function showQuestion() {
  if (currentQuestionIndex >= currentQuestions.length) {
    endGame();
    return;
  }

  const q = currentQuestions[currentQuestionIndex];
  document.getElementById("questionText").textContent = q.q;

  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";

  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.textContent = opt;
    btn.dataset.index = i; // This line was missing before → fixed!
    btn.onclick = () => selectAnswer(i, btn);
    optionsDiv.appendChild(btn);
  });

  document.getElementById("progressBar").style.width = ((currentQuestionIndex + 1) / 10) * 100 + "%";

  timeLeft = 30;
  document.getElementById("timer").textContent = timeLeft;
  clearInterval(timer);
  timer = setInterval(() => {
    timeLeft--;
    document.getElementById("timer").textContent = timeLeft;
    if (timeLeft <= 0) {
      clearInterval(timer);
      selectAnswer(-1, null);
    }
  }, 1000);
}

function selectAnswer(selectedIndex, button) {
  clearInterval(timer);
  const correctIndex = currentQuestions[currentQuestionIndex].a;

  document.querySelectorAll("#options button").forEach((btn, i) => {
    btn.disabled = true;
    if (i === correctIndex) btn.classList.add("correct");
    else if (i === selectedIndex && selectedIndex !== correctIndex) btn.classList.add("wrong");
  });

  if (selectedIndex === correctIndex) {
    score += 10;
    document.getElementById("score").textContent = score;
  }

  setTimeout(() => {
    currentQuestionIndex++;
    showQuestion();
  }, 1600);
}

function endGame() {
  clearInterval(timer);
  document.getElementById("gameScreen").classList.add("hidden");
  document.getElementById("gameOverScreen").classList.remove("hidden");
  document.getElementById("finalScore").textContent = score + "/100";

  let comment = "";
  if (score >= 90) comment = "அற்புதம்! நீங்கள் தமிழ் மேதை!";
  else if (score >= 70) comment = "மிக அருமை! தொடர்ந்து பயிற்சி செய்யுங்கள்!";
  else if (score >= 50) comment = "நன்றாக உள்ளது! இன்னும் கொஞ்சம் முயற்சி!";
  else comment = "கவலை இல்லை! மீண்டும் முயற்சி செய்யுங்கள்!";

  document.getElementById("comment").textContent = comment;
}
</script>
